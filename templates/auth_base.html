<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e2431">
<title>{% block title %}毛概刷题网{% endblock %}</title>
<style>
:root{--red:#9e2431;--red2:#c24350;--bg:#f3f5f7;--text:#20242b;--muted:#6d7480;--line:#e4e7eb;--danger:#c32f3e;--shadow:0 18px 50px rgba(25,32,45,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f7f8fa,#f2e9eb);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;display:grid;place-items:center;padding:24px}.auth{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.top{background:var(--red);color:#fff;padding:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:13px;background:#fff;color:var(--red);display:grid;place-items:center;font-size:21px;font-weight:900}.top h1{font-size:22px;margin:0}.top p{font-size:13px;opacity:.85;margin:5px 0 0}.content{padding:25px 28px 29px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;font:inherit}.field input:focus{border-color:var(--red2);box-shadow:0 0 0 3px #fff0f2}.btn{width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;padding:12px;font:inherit;font-weight:800;cursor:pointer}.error{background:#fff0f2;color:var(--danger);border:1px solid #edb2b8;border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.55;margin-bottom:14px}.switch{text-align:center;color:var(--muted);font-size:13px;margin:17px 0 0}.switch a{color:var(--red);font-weight:700;text-decoration:none}.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-2px 0 16px}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}.warning{font-size:12px;color:#8a4a00;line-height:1.65;margin-top:12px;padding:10px 12px;border:1px solid #f0c27a;background:#fff8e8;border-radius:10px}.availability{font-size:12px;line-height:1.55;margin-top:7px}.availability.neutral{color:var(--muted)}.availability.available{color:#187647}.availability.unavailable{color:var(--danger)}.btn:disabled{opacity:.48;cursor:not-allowed}
</style>
</head>
<body><main class="auth"><div class="top"><div class="brand"><div class="mark">概</div><div><h1>毛概刷题网</h1><p>学号登录 · 自动同步答题进度</p></div></div></div><div class="content"><aside role="note" style="padding:10px 16px;background:#fff8e8;color:#704200;border-bottom:1px solid #efd8aa;font-size:13px;line-height:1.6">本地演示版：题目均为合成示例，请勿输入真实学号。历史登录方式没有密码，不适合直接用于公网真实账户。</aside>{% block content %}{% endblock %}</div></main></body>
</html>
